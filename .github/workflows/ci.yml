name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each OS has its own tray backend: D-Bus StatusNotifierItem on Linux,
        # Objective-C (cgo) on macOS, Win32 on Windows.
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Formatting
        if: runner.os == 'Linux'
        # internal/generated is produced by dbus-codegen-go and kept as generated.
        run: |
          unformatted=$(gofmt -l . | grep -v '^internal/generated/' || true)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: D-Bus stays out of non-D-Bus platforms
        if: runner.os == 'Linux'
        # Go does not treat a _unix file suffix as a build constraint, so a D-Bus
        # file without a //go:build line silently pulls godbus into every build.
        run: |
          for os in darwin windows android; do
            deps=$(CGO_ENABLED=1 GOOS=$os go list -deps .)
            grep -qx 'github.com/belluikit/systray' <<<"$deps" || { echo "::error::go list for $os did not list the package"; exit 1; }
            if grep godbus <<<"$deps"; then
              echo "::error::$os build depends on godbus"; exit 1
            fi
            echo "$os: no godbus"
          done

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...
